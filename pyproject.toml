[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "digital-verify-pro"
version = "2.0.0"
description = "专业级数字芯片验证框架 — Dual-mode RTL verification with coverage-driven convergence"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "KAI", email = "kai@openclaw.ai" },
]

dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "black>=23.0",
]
formal = [
    "pysby>=0.1",
]
vcd = [
    "vcdvcd>=2.0",
]

[project.urls]
Repository = "https://github.com/Joe1995-best/digital-verify-pro"
Documentation = "https://github.com/Joe1995-best/digital-verify-pro#readme"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "standalone-skills/*/tests"]
